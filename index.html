async function mkPw(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000;return{s:b64(salt),i:it,h:b64(await kdf(pw,salt,it))}}
const same=(a,b)=>{if(a.length!=b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a[i]^b[i];return r==0};
async function chkPw(u,pw){try{
 if(!u||(!u.ph&&u.pass==null)){await kdf(pw,new Uint8Array(16),150000);return false}
 if(!u.ph){const ok=u.pass===pw;if(ok){u.ph=await mkPw(pw);delete u.pass;save()}return ok}
 return same(await kdf(pw,ub(u.ph.s),u.ph.i),ub(u.ph.h))}catch(e){alert('Browser tidak mendukung pengamanan kata sandi. Buka aplikasi lewat alamat HTTPS.');return false}}

function pd(v){const t=String(v==null?'':v).trim();if(!t)return'';let m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');if(/^\d{5}$/.test(t))return new Date(Math.round((+t-25569)*864e5)).toISOString().slice(0,10);return null}
function pb(v){const t=String(v||'').trim().toLowerCase();if(!t)return'Putih';const m=t.match(/kyu\s*(\d)/);if(m){const b=Object.keys(KYUN).find(k=>KYUN[k]=='Kyu '+m[1]);if(b)return b}if(/strip/.test(t))return'Coklat Strip';if(/cokelat|coklat/.test(t))return'Coklat';for(const b of['Putih','Kuning','Oranye','Hijau','Biru','Hitam'])if(t.includes(b.toLowerCase()))return b;return/\bdan\b/.test(t)?'Hitam':null}
function ps(v){const t=String(v||'').trim().toLowerCase();if(!t)return'';if(/^(l|laki|pria|male|m)/.test(t))return'Laki-laki';if(/^(p|perempuan|wanita|female|f)/.test(t))return'Perempuan';return''}

function impStep1(msg){$('#impb').innerHTML=`${msg?`<p class=warn>${msg}</p>`:''}<ol style="padding-left:20px;line-height:1.7;margin:8px 0"><li>Unduh template Excel.</li><li>Isi data kohay sesuai kolom di template.</li><li>Unggah file di bawah, lalu cek hasilnya sebelum diimpor.</li></ol><button class=btn onclick=tplDl()>⬇ Unduh template Excel</button><label class=drop ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();impFile(event.dataTransfer.files[0])"><b>Tarik file ke sini</b><br><span style="color:var(--mut)">atau klik untuk memilih file (.xlsx, .xls, .csv)</span><input type=file accept=".xlsx,.xls,.csv" onchange="impFile(this.files[0])"></label>`}
function impFile(f){if(!f)return;if(f.size>3e6)return impStep1('File terlalu besar (maksimal 3 MB).');f.arrayBuffer().then(b=>{let a;try{const wb=XLSX.read(b,{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'});a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''})}catch(e){return impStep1('File tidak bisa dibaca. Gunakan file Excel atau CSV.')}
if(a.length>2001)return impStep1('Maksimal 2000 baris per impor.');const H=(a[0]||[]).map(nk),ix={};for(const k in AL)ix[k]=H.findIndex(h=>AL[k].includes(h));if(ix.nama<0)return impStep1('Kolom "Nama Lengkap" tidak ditemukan. Gunakan template dari tombol di bawah.');
const d=D(),seen={};IMP=[];a.slice(1).forEach((r,i)=>{if(!r.some(c=>String(c).trim()))return;const n=i+2,g=k=>ix[k]<0?'':String(r[ix[k]]==null?'':r[ix[k]]).trim(),name=g('nama');
if(!name)return IMP.push({k:'err',n,m:'Nama lengkap kosong'});const belt=pb(g('belt'));if(!belt)return IMP.push({k:'err',n,m:name+': sabuk "'+g('belt')+'" tidak dikenal'});const dob=pd(g('dob')),jn=pd(g('join'));if(dob===null||jn===null)return IMP.push({k:'err',n,m:name+': format tanggal tidak dikenal (pakai 31-12-2012)'});
let ph=g('phone');if(/^8\d{8,12}$/.test(ph))ph='0'+ph;const v={nia:g('nia'),name,pob:g('pob'),dob,sex:ps(g('sex')),addr:g('addr'),phone:ph,join:jn||today(),status:/^(non|tidak)/i.test(g('status'))?'Non-aktif':'Aktif',belt},key=v.nia||name.toLowerCase()+'|'+dob;
if(seen[key])return IMP.push({k:'err',n,m:name+': duplikat di dalam file'});seen[key]=1;const ex=d.students.find(s=>(v.nia&&s.nia==v.nia)||(s.name.toLowerCase()==name.toLowerCase()&&(s.dob||'')==dob));IMP.push({k:ex?'up':'new',n,v,ex})});

function pdGoO(i){cm();PCB=pdOrgs()[i]||'';PT='s';PQ='';draw()}

/* 3. Event mendatang (event buatan pengurus + event dari dojo) */
const PLV=['Dojo','Kabupaten','Provinsi','Nasional','Internasional'],PTP=[['Open','Open (diselenggarakan pihak lain)'],['Internal','Internal perguruan']];
const pdLv=l=>Math.max(1,LV.indexOf(l=='Kabupaten'?'Cabang':l)+1);
function pdEvs(){const m={},T=today();((S.pusat||{}).events||[]).forEach(e=>{if(!e.date||e.date<T)return;m[e.name+'|'+e.date]={k:e.name+'|'+e.date,name:e.name,date:e.date,place:e.place,level:e.level,rows:[],cid:e.id,type:e.type,deadline:e.deadline}});
S.dojos.forEach(j=>{const d=S.data[j.id];if(!d)return;(d.events||[]).forEach(e=>{if(!e.date||e.date<T)return;const k=e.name+'|'+e.date,g=m[k]||(m[k]={k:k,name:e.name,date:e.date,place:e.place,level:e.level,rows:[]});(e.entries||[]).forEach(x=>g.rows.push({j:j,x:x,s:pdFx((d.students||[]).find(s=>s.id==x.sid))}))})});return Object.values(m).sort((a,b)=>a.date.localeCompare(b.date))}
function pdE(){const E=pdEvs();return`<div class=bar><h2 class=g>Event mendatang</h2><button class="btn pri" onclick="pdEvForm()">+ Tambah event</button></div>${E.map((g,i)=>{const dl=daysTo(g.date),cl=g.deadline?daysTo(g.deadline):null;return`<div class=card><div class=bar style="margin:0"><div class=g><h3 style="margin:0">${esc(g.name)}</h3><small>${fd(g.date)}, ${esc(g.place||'-')}, tingkat ${esc(g.level)}</small>${g.deadline?`<small>Batas pendaftaran: ${fd(g.deadline)}</small>`:''}</div><span class="bd ${dl<=14?'warn':''}">${dl>0?dl+' hari lagi':'Hari ini'}</span></div><div class=ev style="margin:8px 0"><span class=bd>${g.cid?(g.type=='Internal'?'Internal perguruan':'Open, pihak lain'):'Dari dojo'}</span>${cl==null?'':cl<0?'<span class="bd warn">Pendaftaran ditutup</span>':`<span class="bd ${cl<=7?'warn':'tag'}">Daftar ${cl==0?'terakhir hari ini':'tutup '+cl+' hari lagi'}</span>`}<span class=bd>${g.rows.length} peserta</span><span class=bd>${new Set(g.rows.map(x=>x.j.id)).size} dojo</span><span class=bd>${g.rows.filter(x=>x.x.status=='Siap').length} siap</span></div>${g.rows.length?g.rows.map(x=>`<div class=row style="cursor:default;padding:8px 4px">${av(x.s)}<div class=g><b>${esc(x.s.name)}</b><small>${esc(x.j.name)}, ${esc(x.x.cat)}</small></div><span class=bd>${esc(x.x.status||'-')}</span></div>`).join(''):'<p class=emp style="padding:8px">Belum ada atlet yang didaftarkan dojo.</p>'}<div class=bar style="margin:8px 0 0"><button class="btn sm pri" onclick="pdGoE(${i})">Seleksi untuk event ini</button>${g.cid?`<button class="btn sm" onclick="pdEvForm('${esc(g.cid)}')">Ubah</button><button class="btn sm" onclick="pdEvDel('${esc(g.cid)}')">Hapus</button>`:''}</div></div>`}).join('')||'<p class="emp card">Belum ada event mendatang. Tekan Tambah event untuk membuatnya.</p>'}`}
function pdGoE(i){const g=pdEvs()[i];if(!g)return;PEV=g.k;PT='s';PQ='';draw()}
function pdEvForm(id){if(!ses||!ses.central)return;const P=PU();P.events=P.events||[];const e=id?P.events.find(x=>x.id==id):{type:'Open',name:'',level:'Provinsi',date:'',deadline:'',place:''};if(!e)return;
modal(id?'Ubah event':'Tambah event',F('type','Jenis event',e.type,0,PTP)+F('name','Nama event',e.name)+F('level','Tingkat kejuaraan',e.level,0,PLV)+`<div class=two>${F('date','Tanggal acara',e.date,'date')}${F('deadline','Batas akhir pendaftaran',e.deadline,'date')}</div>`+F('place','Lokasi',e.place),f=>{if(!ses||!ses.central)return;const nm=clean(f.name,100),pl=clean(f.place,120),D=/^\d{4}-\d{2}-\d{2}$/;
if(nm.length<3)return alert('Nama event wajib diisi.');if(!PTP.some(t=>t[0]==f.type)||!PLV.includes(f.level))return;if(!D.test(f.date)||!D.test(f.deadline))return alert('Tanggal acara dan batas akhir pendaftaran wajib diisi.');if(f.deadline>f.date)return alert('Batas akhir pendaftaran tidak boleh setelah tanggal acara.');if(!id&&f.date<today())return alert('Tanggal acara sudah lewat.');if(!pl)return alert('Lokasi wajib diisi.');
if(P.events.some(x=>x.id!=id&&x.name.toLowerCase()==nm.toLowerCase()&&x.date==f.date))return alert('Event dengan nama dan tanggal yang sama sudah ada.');
if(id){const ok=e.name+'|'+e.date,nk2=nm+'|'+f.date;(P.sel||[]).forEach(z=>{if(z.ev==ok){z.ev=nk2;z.evName=nm}});if(PEV==ok)PEV=nk2;Object.assign(e,{type:f.type,name:nm,level:f.level,date:f.date,deadline:f.deadline,place:pl})}else{if(P.events.length>=500)return alert('Daftar event penuh.');P.events.push({id:uid(),type:f.type,name:nm,level:f.level,date:f.date,deadline:f.deadline,place:pl})}
save();draw();toast(id?'Event diperbarui':'Event ditambahkan')},id?'Simpan':'Tambah event')}
function pdEvDel(id){if(!ses||!ses.central)return;const P=PU(),e=(P.events||[]).find(x=>x.id==id);if(!e||!confirm('Hapus event "'+e.name+'"? Atlet yang sudah dipilih untuk event ini ikut dihapus dari seleksi.'))return;const k=e.name+'|'+e.date;P.events=P.events.filter(x=>x.id!=id);P.sel=(P.sel||[]).filter(z=>z.ev!=k);if(PEV==k)PEV='';save();draw()}

/* 4. Riwayat kejuaraan */
function pdR(){const m={};S.dojos.forEach(j=>{const d=S.data[j.id];if(!d)return;const SS=d.students||[];(d.ach||[]).forEach(a=>{const k=a.year+'|'+a.champ+'|'+a.level,g=m[k]||(m[k]={y:+a.year,name:a.champ,level:a.level,a:[],p:0});g.a.push({a:a,j:j,s:pdFx(SS.find(s=>s.id==a.sid))})});(d.events||[]).forEach(e=>{if(!e.date||e.date>=today())return;const k=e.date.slice(0,4)+'|'+e.name+'|'+e.level,g=m[k]||(m[k]={y:+e.date.slice(0,4),name:e.name,level:e.level,a:[],p:0});g.p+=(e.entries||[]).length})});
const all=Object.values(m),Y=[...new Set(all.map(g=>g.y))].sort().reverse(),G=all.filter(g=>!PYR||String(g.y)==PYR).sort((a,b)=>b.y-a.y||String(a.name).localeCompare(String(b.name),'id'));
return`<div class=bar><h2 class=g>Riwayat kejuaraan</h2><select aria-label="Filter tahun" onchange="PYR=this.value;draw()" style="width:auto;min-width:130px"><option value="">Semua tahun</option>${Y.map(y=>`<option ${PYR==y?'selected':''}>${y}</option>`).join('')}</select></div>${G.map(g=>{const mm=[1,2,3].map(k=>g.a.filter(x=>x.a.medal==k).length);return`<div class=card><h3 style="margin:0">${esc(g.name)}</h3><small>${g.y}, tingkat ${esc(g.level)}</small><div class=ev style="margin:8px 0">${pdMed(mm)}${g.p?`<span class=bd>${g.p} peserta</span>`:''}</div>${g.a.slice().sort((x,y)=>x.a.medal-y.a.medal).map(x=>`<div class=row style="cursor:default;padding:8px 4px"><span class=bd style="background:${MC[x.a.medal]};color:${x.a.medal==3?'#fff':'#111'}">${MD[x.a.medal]}</span><div class=g><b>${esc(x.s.name)}</b><small>${esc(x.j.name)}, ${esc(((x.a.cat||'')+' '+(x.a.cls||'')).trim()||'-')}</small></div></div>`).join('')||'<p class=emp style="padding:8px">Belum ada medali tercatat.</p>'}</div>`}).join('')||'<p class="emp card">Belum ada riwayat kejuaraan.</p>'}`}

/* 5. Seleksi atlet */
function pdCur(){const ev=pdEvs().find(g=>g.k==PEV),evk=ev?ev.k:'';return{ev:ev,evk:evk,cur:((S.pusat||{}).sel||[]).filter(z=>(!PCB||z.org==PCB)&&z.ev==evk)}}
function pdS(){const O=pdOrgs(),E=pdEvs(),c=pdCur(),q=PQ.trim().toLowerCase(),cand=pdAll().filter(x=>(x.s.status||'Aktif')=='Aktif'&&(!PCB||x.org==PCB)&&(!q||(x.s.name+' '+x.j.name).toLowerCase().includes(q))).sort(pdSort);
return`<h2 style="margin-bottom:12px">Seleksi atlet</h2><div class=card><p class=note style="margin:0 0 6px">Pilih cabang perguruan dan event tujuan, lalu tandai atlet berprestasi yang akan mewakili cabang.</p><div class=two><label>Cabang perguruan<select onchange="PCB=this.value;draw()"><option value="">Semua cabang</option>${O.map(o=>`<option value="${esc(o)}" ${PCB==o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><label>Event tujuan<select onchange="PEV=this.value;draw()"><option value="">Umum (tanpa event tertentu)</option>${E.map(g=>`<option value="${esc(g.k)}" ${c.evk==g.k?'selected':''}>${esc(g.name)} (${fd(g.date)})</option>`).join('')}</select></label></div></div>
<div class=bar><h3 class=g style="margin:0">Atlet terpilih (${c.cur.length})</h3>${c.cur.length?'<button class="btn sm" onclick=pdExp()>Ekspor (.xlsx)</button>':''}</div><div class=card style="padding:4px">${c.cur.map((z,i)=>`<div class=row style="cursor:default"><b class=bd>${i+1}</b><div class=g><b>${esc(z.name)}</b><small>${esc(z.dojo)}, ${esc(z.org)}</small><small>${z.evName?'Event: '+esc(z.evName):'Umum'}</small></div>${bd(z.belt)}<button class="btn sm" onclick="pdDel('${esc(z.id)}')">Hapus</button></div>`).join('')||'<p class=emp>Belum ada atlet yang dipilih. Tekan Pilih pada daftar kandidat di bawah.</p>'}</div>
<div class=bar><h3 class=g style="margin:0">Kandidat atlet berprestasi (${cand.length})</h3><div class=sb2><span aria-hidden=true>🔍</span><input type=search placeholder="Cari atlet atau dojo" aria-label="Cari kandidat" value="${esc(PQ)}" oninput="PQ=this.value;$('#pdc').innerHTML=pdCL()"></div></div><div class=card id=pdc style="padding:4px">${pdCL()}</div>${PNOTE}`}
function pdCL(){const c=pdCur(),q=PQ.trim().toLowerCase(),cand=pdAll().filter(x=>(x.s.status||'Aktif')=='Aktif'&&(!PCB||x.org==PCB)&&(!q||(x.s.name+' '+x.j.name).toLowerCase().includes(q))).sort(pdSort);return cand.map(x=>{const on=c.cur.some(z=>z.aid==x.id);return pdRow(x,`<button class="btn sm ${on?'dk':'pri'}" onclick="event.stopPropagation();pdTog('${esc(x.id)}')">${on?'✓ Terpilih':'Pilih'}</button>`)}).join('')||'<p class=emp>Tidak ada kandidat untuk cabang ini.</p>'}
function pdTog(aid){if(!ses||!ses.central)return;const r=pdAll().find(x=>x.id==aid);if(!r)return;const P=PU();P.sel=P.sel||[];const c=pdCur(),i=P.sel.findIndex(z=>z.aid==aid&&z.ev==c.evk);if(i>=0)P.sel.splice(i,1);else{if(P.sel.length>=2000)return alert('Daftar seleksi penuh.');P.sel.push({id:uid(),aid:aid,name:r.s.name,dojo:r.j.name,org:r.org,belt:r.s.belt,ev:c.evk,evName:c.ev?c.ev.name:'',pt:r.pt,date:today()})}save();draw()}
function pdDel(id){if(!ses||!ses.central)return;const P=PU();P.sel=(P.sel||[]).filter(z=>z.id!=id);save();draw()}
async function pdExp(){if(!ses||!ses.central)return;const rows=pdCur().cur.map((z,i)=>({'No':i+1,'Nama Atlet':z.name,'Dojo':z.dojo,'Cabang Perguruan':z.org,'Sabuk':z.belt,'Poin Prestasi':z.pt,'Event Tujuan':z.evName||'Umum','Tanggal Seleksi':z.date}));const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[5,26,26,26,12,12,34,14].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Seleksi Atlet');const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'}),fn='Seleksi_Atlet.xlsx';try{const dl=window.claude&&await claude.use('downloads');if(dl)return await dl.save({filename:fn,data:buf})}catch(e){}XLSX.writeFile(wb,fn)}

/* Detail atlet (tanpa alamat dan telepon) */
function pdDet(id){const r=pdAll().find(x=>x.id==id);if(!r)return;const s=r.s;box('Detail atlet',`<div class=row style="cursor:default;padding:4px 0">${av(s)}<div class=g><b>${esc(s.name)}</b><small>${esc(r.j.name)}, ${esc(r.org)}</small><small>${esc(s.nia||'-')}, ${esc(s.sex||'-')}${s.dob?', '+age(s.dob)+' th':''}</small></div>${bd(s.belt)}</div><div class=ev style="margin:8px 0"><span class=bd>${r.pt} poin</span>${pdMed(r.m)}</div><h3 style="margin-top:12px">Prestasi</h3>${r.a.slice().sort((x,y)=>x.medal-y.medal||(+y.year)-(+x.year)).map(a=>`<div class=row style="cursor:default;padding:8px 0"><span class=bd style="background:${MC[a.medal]};color:${a.medal==3?'#fff':'#111'}">${MD[a.medal]}</span><div class=g><b>${esc(a.champ)}</b><small>${esc(a.level)}, ${esc(a.year)}, ${esc(((a.cat||'')+' '+(a.cls||'')).trim()||'-')}</small></div></div>`).join('')||'<p class=emp style="padding:8px 0">Belum ada prestasi.</p>'}<h3 style="margin-top:12px">Kejuaraan diikuti</h3>${r.en.map(z=>`<div class=row style="cursor:default;padding:8px 0"><div class=g><b>${esc(z.e.name)}</b><small>${fd(z.e.date)}, ${esc(z.x.cat)}</small></div><span class=bd>${esc(z.x.status||'-')}</span></div>`).join('')||'<p class=emp style="padding:8px 0">Belum ada.</p>'}<button class="btn pri wide" onclick="pdGoO(${pdOrgs().indexOf(r.org)})">Seleksi atlet cabang ini</button>`)}

/* TETAP MASUK DI PERANGKAT INI */
try{const r=JSON.parse(sessionStorage.getItem('dojoflow_ses')||'null');if(r&&r.uid&&r.exp>Date.now()&&Date.now()-r.last<IDLE){const u=S.users.find(x=>x.id==r.uid&&S.data[x.dojo]&&S.dojos.some(j=>j.id==x.dojo));if(u){ses={dojo:u.dojo,role:u.role,uid:u.id};SX={exp:r.exp,last:Date.now()}}}}catch(e){}
/* IKON MATA UNTUK KATA SANDI */
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function eyes(){document.querySelectorAll('textarea:not([maxlength])').forEach(t=>t.maxLength=1000);
document.querySelectorAll('input[name=u],input[name=username]').forEach(i=>{i.autocomplete='username';i.autocapitalize='off';i.spellcheck=false;i.setAttribute('autocorrect','off')});
document.querySelectorAll('input[type=password]:not([autocomplete])').forEach(i=>i.autocomplete=['p','old'].includes(i.name)?'current-password':'new-password');
document.querySelectorAll('input[type=password]').forEach(i=>{if(i.parentNode.classList.contains('pw'))return;const w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='eye';b.innerHTML=EYE;b.setAttribute('aria-label','Tampilkan kata sandi');b.setAttribute('aria-pressed','false');b.onclick=()=>{const sh=i.type=='password';i.type=sh?'text':'password';b.innerHTML=sh?EYEX:EYE;b.setAttribute('aria-label',sh?'Sembunyikan kata sandi':'Tampilkan kata sandi');b.setAttribute('aria-pressed',String(sh));i.focus()};w.appendChild(b)})}
new MutationObserver(eyes).observe(document.body,{childList:true,subtree:true});
migrate().finally(()=>{draw();if(WEAK)setTimeout(()=>alert('Peringatan keamanan: ada akun yang masih memakai kata sandi bawaan (demo123 atau pusat123). Segera ganti kata sandinya atau hapus akun tersebut.'),300)});
</script></body></html>
