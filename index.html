 try{await FB.userUpdate(id,{role:r});await loadUsers();alert("Peran "+nm+" sekarang "+(r=="admin"?"Pengurus":"Pelatih")+". Perubahan berlaku setelah ia keluar lalu masuk lagi.")}catch(e){alert(uErr(e))}}
async function uApprove(id){try{await FB.userUpdate(id,{aktif:true,status:"aktif"});await loadUsers()}catch(e){alert(uErr(e))}}
function dojoHtml(){const m={};USERS.filter(u=>u.role=="pelatih"&&u.dojo&&!isPend(u)).forEach(u=>{const k=norm(u.dojo);(m[k]=m[k]||{n:u.dojo,p:[]}).p.push(u)});
 const L=Object.keys(m).sort().map(k=>{const d=m[k],n=S.a.filter(a=>norm(a.dojo)==k).length;return `<div class="box" style="margin-top:10px"><div class="row"><b class="sp">${esc(d.n)}</b><span class="mut">${n} atlet</span></div><div class="mut">Pelatih: ${d.p.map(u=>esc(u.nama||u.email)).join(", ")}</div></div>`}).join("");
 const w=USERS.filter(u=>u.role=="pelatih"&&!u.dojo&&u.aktif!==false).length;
 return `<h2>Dojo terdaftar (${Object.keys(m).length})</h2>${L||'<div class="box mut">Belum ada dojo yang didaftarkan pelatih.</div>'}${w?`<p class="mut">${w} akun pelatih belum mendaftarkan dojo.</p>`:""}<h2>Akun</h2>`}
function admBody(){return pendHtml()+dojoHtml()+usersHtml()}
const uErr=e=>{const c=e&&e.code||"";return c=="auth/email-already-in-use"||c=="auth/invalid-credential"||c=="auth/wrong-password"?"Email ini sudah terdaftar dengan kata sandi lain. Gunakan email lain, atau minta pelatih memakai Reset sandi.":c=="auth/weak-password"?"Kata sandi awal terlalu lemah (minimal 6 karakter).":c=="auth/invalid-email"?"Format email tidak valid.":c=="auth/operation-not-allowed"?"Pendaftaran akun dimatikan. Aktifkan Enable create (sign-up) di Firebase: Authentication > Settings > User actions.":c=="app/is-admin"?"Email ini milik akun admin.":c=="permission-denied"?"Tidak ada izin. Periksa Rules Firestore.":"Gagal: "+(c||e)};
function formUser(id){const u=id?USERS.find(x=>x.id==id):{nama:"",email:""};
 D.innerHTML=`<h2>${id?"Ubah data pelatih":"Tambah pelatih"}</h2><label>Nama pelatih<input id="un" value="${esc(u.nama)}"></label>${id?`<div class="mut" style="margin-top:6px">${esc(u.email)}</div><label>Dojo (hanya pengurus yang dapat mengubah)<input id="udj" value="${esc(u.dojo)}"></label>`:`<label>Email<input id="ue" type="email" autocomplete="off"></label><label>Kata sandi awal (minimal 6 karakter)<input id="up" type="text" autocomplete="off"></label><p class="mut">Sampaikan email dan kata sandi ini kepada pelatih. Pelatih login lewat tombol Pelatih, mendaftarkan dojonya sendiri saat pertama masuk, dan bisa mengganti kata sandi di menu Profil.</p>`}<div id="um" style="color:var(--ac);min-height:20px"></div><div class="row"><button class="b p sp" onclick="saveUser('${id||""}')">Simpan</button><button class="b" onclick="D.close()">Batal</button></div>`;D.showModal()}
async function saveUser(id){const n=un.value.trim();if(!n){um.textContent="Isi nama pelatih.";return}
 try{if(id)await FB.userUpdate(id,{nama:n,dojo:udj.value.trim()});else{const e=ue.value.trim(),p=up.value;if(!e){um.textContent="Isi email.";return}if(p.length<6){um.textContent="Kata sandi awal minimal 6 karakter.";return}um.textContent="Menyimpan...";await FB.userAdd(n,e,p)}D.close();await loadUsers()}catch(x){um.textContent=uErr(x)}}
async function uReset(id){const u=USERS.find(x=>x.id==id);if(!confirm("Kirim email reset kata sandi ke "+u.email+"?"))return;try{await FB.resetPass(u.email);alert("Email reset kata sandi dikirim ke "+u.email+".")}catch(e){alert(uErr(e))}}
async function uToggle(id){const u=USERS.find(x=>x.id==id);try{await FB.userUpdate(id,{aktif:u.aktif===false});await loadUsers()}catch(e){alert(uErr(e))}}
async function uDel(id){const u=USERS.find(x=>x.id==id);if(!confirm("Hapus akses "+(u.nama||u.email)+"? Akun ini tidak bisa masuk lagi."))return;try{await FB.userDel(id);await loadUsers()}catch(e){alert(uErr(e))}}
D.addEventListener("cancel",e=>{if(window.NEEDLOGIN||window.NEEDDOJO)e.preventDefault()});
/* Menu samping: tarik/geser masuk-keluar */
(function(){const dr=document.getElementById("dr"),hd=document.getElementById("hd"),bd=document.getElementById("bd");
let p=0,g=null,swallow=false;const W=()=>dr.offsetWidth||230;
function setP(v,an){p=Math.max(0,Math.min(1,v));dr.style.transition=an?"transform .25s ease":"none";bd.style.transition=an?"opacity .25s ease":"none";dr.style.transform="translateX("+((p-1)*100)+"%)";bd.style.opacity=p;bd.style.pointerEvents=p>.02?"auto":"none";dr.classList.toggle("open",p>.02);const o=p>.5;hd.textContent=o?"\u2039":"\u2630";hd.setAttribute("aria-expanded",o);hd.setAttribute("aria-label",o?"Tutup menu":"Buka menu")}
window.openDr=()=>setP(1,1);window.closeDr=()=>setP(0,1);
const start=(e,src)=>{g={x:e.clientX,y:e.clientY,p0:p,src,on:false,t:Date.now(),dx:0}};
hd.addEventListener("pointerdown",e=>{start(e,"h");try{hd.setPointerCapture(e.pointerId)}catch(x){}});
dr.addEventListener("pointerdown",e=>{if(e.target!==hd&&p>.5)start(e,"d")});
window.addEventListener("pointermove",e=>{if(!g)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
 if(!g.on){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){g.on=true;if(g.src=="d")try{dr.setPointerCapture(e.pointerId)}catch(x){}}else return}
 g.dx=dx;setP(g.p0+dx/W())});
function end(e,cancel){if(!g)return;const m=g;g=null;
 if(m.on){swallow=true;setTimeout(()=>swallow=false,60);const v=m.dx/Math.max(1,Date.now()-m.t);setP(v>.4?1:v<-.4?0:p>.5?1:0,1)}
 else if(m.src=="h"&&!cancel)setP(p>.5?0:1,1)}
window.addEventListener("pointerup",e=>end(e,false));window.addEventListener("pointercancel",e=>end(e,true));
document.addEventListener("click",e=>{if(swallow){e.stopPropagation();e.preventDefault()}},true);
hd.addEventListener("click",e=>{if(e.detail===0)setP(p>.5?0:1,1)});
bd.addEventListener("click",()=>setP(0,1));
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&p>.5)setP(0,1)});
setP(0,0)})();
load();render();initDb();
</script>
<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,EmailAuthProvider,reauthenticateWithCredential,updatePassword,updateProfile,verifyBeforeUpdateEmail,createUserWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,collection,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const C=window.FIREBASE_CONFIG,hp=document.querySelector("header p"),base=hp.textContent;
if(C.apiKey&&!C.apiKey.startsWith("ISI")){
const app=initializeApp(C),auth=getAuth(app),fs=getFirestore(app),ref=doc(fs,"app","state"),lo=document.getElementById("lo");let un=[];
window.FB={login:(e,p)=>signInWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth),
 listUsers:async()=>(await getDocs(collection(fs,"users"))).docs.map(d=>({id:d.id,...d.data()})),
 userUpdate:(id,o)=>setDoc(doc(fs,"users",id),o,{merge:true}),
 userDel:id=>deleteDoc(doc(fs,"users",id)),
 resetPass:e=>sendPasswordResetEmail(auth,e),
 userAdd:async(nama,email,pass)=>{const a2=initializeApp(C,"sek"+Date.now()),au=getAuth(a2);let uid;
  try{let cr;try{cr=await createUserWithEmailAndPassword(au,email,pass)}catch(e){if(e.code=="auth/email-already-in-use")cr=await signInWithEmailAndPassword(au,email,pass);else throw e}
  uid=cr.user.uid;const ex=await getDoc(doc(fs,"users",uid));if(ex.exists()&&ex.data().role=="admin")throw{code:"app/is-admin"};
  await updateProfile(cr.user,{displayName:nama});await signOut(au)}finally{try{await deleteApp(a2)}catch(e){}}
  await setDoc(doc(fs,"users",uid),{role:"pelatih",nama,email,aktif:true})},
 setName:async n=>{await updateProfile(auth.currentUser,{displayName:n});await setDoc(doc(fs,"users",auth.currentUser.uid),{nama:n},{merge:true});window.ME.name=n;lo.textContent=(n||window.ME.email)+" \u25be"},
 signup:async(nama,email,pass,dojo)=>{const a2=initializeApp(C,"reg"+Date.now()),au=getAuth(a2),f2=getFirestore(a2);
  try{let cr;try{cr=await createUserWithEmailAndPassword(au,email,pass)}catch(e){if(e.code=="auth/email-already-in-use"){try{cr=await signInWithEmailAndPassword(au,email,pass)}catch(x){throw e}}else throw e}
  const r=doc(f2,"users",cr.user.uid);if((await getDoc(r)).exists())throw{code:"app/sudah-ada"};
  await updateProfile(cr.user,{displayName:nama});await setDoc(r,{role:"pelatih",nama,email,dojo,aktif:false,status:"menunggu"});await signOut(au)}
  finally{try{await deleteApp(a2)}catch(e){}}},
 regDojo:async n=>{const id=auth.currentUser.uid;let dup=false;try{dup=(await getDocs(collection(fs,"users"))).docs.some(d=>d.id!==id&&String(d.data().dojo||"").trim().toLowerCase().replace(/\s+/g," ")==n.toLowerCase())}catch(e){}
  if(dup)throw{code:"app/dojo-dup"};await setDoc(doc(fs,"users",id),{dojo:n},{merge:true});window.ME.dojo=n},
 setPass:async(c,n)=>{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,c));await updatePassword(u,n)},
 setEmail:async(c,e)=>{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,c));await verifyBeforeUpdateEmail(u,e)},putFoto:async(id,d)=>{await setDoc(doc(fs,"foto",id),{d});FOTO[id]=d}};
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];setDB(null);lo.hidden=!u;
 if(!u){window.ME=null;setROLE(null);window.NEEDLOGIN=true;try{localStorage.removeItem(KEY)}catch(e){}hp.textContent=base;render();return}
 let role=null,ud={};try{const r=await getDoc(doc(fs,"users",u.uid));ud=r.exists()?r.data():{};role=ud.role||null}catch(e){}
 if(role!=="admin"&&role!=="pelatih"){window.LERR="Akun ini belum diberi peran. Hubungi pengurus.";window.WANT=null;await signOut(auth);return}
 if(ud.aktif===false){window.LERR=ud.status=="menunggu"?"Pendaftaran Anda masih menunggu persetujuan pengurus.":"Akun ini dinonaktifkan. Hubungi pengurus.";window.WANT=null;await signOut(auth);return}
 if(window.WANT&&window.WANT!==role){window.LERR=window.WANT=="admin"?"Akun ini bukan pengurus. Pilih Pelatih untuk masuk.":"Akun ini terdaftar sebagai pengurus. Pilih Pengurus untuk masuk.";window.WANT=null;await signOut(auth);return}
 window.WANT=null;if(ud.email!==u.email||ud.nama===undefined)setDoc(doc(fs,"users",u.uid),{email:u.email,nama:ud.nama||u.displayName||""},{merge:true}).catch(()=>{});setROLE(role);window.ME={uid:u.uid,name:u.displayName||"",email:u.email,role,dojo:ud.dojo||""};lo.textContent=(u.displayName||u.email)+" \u25be";window.NEEDLOGIN=false;if(D.open)D.close();D.style.borderTop="";
 try{const s=await getDoc(ref);
  if(s.exists()){setS(JSON.parse(s.data().json))}else{setS({a:[],ev:[]});await setDoc(ref,{json:JSON.stringify(S)})}
  setDB({set:o=>setDoc(ref,o)});hp.textContent=base+" \u00b7 Data bersama aktif \u00b7 "+(role=="admin"?"Pengurus":"Pelatih");render();if(role=="admin")FB.listUsers().then(L=>{window.PEND=L.filter(x=>x.role=="pelatih"&&x.aktif===false&&x.status=="menunggu").length;if(!D.open)render()}).catch(()=>{});
  un.push(onSnapshot(ref,x=>{if(!x.exists()||x.metadata.hasPendingWrites||D.open)return;const j=x.data().json;if(j!==JSON.stringify(S)){setS(JSON.parse(j));render()}}));
  un.push(onSnapshot(collection(fs,"foto"),q=>{q.docs.forEach(d=>FOTO[d.id]=d.data().d);if(!D.open)render()}));
 }catch(e){hp.textContent=base+" \u00b7 Gagal terhubung: "+(e.code||e.message);render()}
});
}else{hp.textContent=base+" \u00b7 Mode lokal (database belum diatur)"}
</script>
